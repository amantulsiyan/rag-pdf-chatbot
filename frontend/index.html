<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG PDF Chatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 RAG PDF Chatbot</h1>
            <p class="subtitle">Hybrid Retrieval-Augmented Generation System</p>
        </header>

        <!-- Auth Section -->
        <div class="main-content" id="authSection">
            <div class="auth-container">
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="switchTab('login')">Login</button>
                    <button class="auth-tab" onclick="switchTab('register')">Register</button>
                </div>

                <div id="loginForm" class="auth-form">
                    <h2>Welcome Back</h2>
                    <input type="email" id="loginEmail" placeholder="Email" class="auth-input">
                    <input type="password" id="loginPassword" placeholder="Password" class="auth-input">
                    <button class="btn-primary" onclick="login()">Login</button>
                    <div id="loginStatus" class="status-message"></div>
                </div>

                <div id="registerForm" class="auth-form" style="display:none">
                    <h2>Create Account</h2>
                    <input type="email" id="registerEmail" placeholder="Email" class="auth-input">
                    <input type="password" id="registerPassword" placeholder="Password (min 8 chars)" class="auth-input">
                    <button class="btn-primary" onclick="register()">Register</button>
                    <div id="registerStatus" class="status-message"></div>
                </div>
            </div>
        </div>

        <div class="main-content" id="appSection" style="display:none">
            <div class="app-header">
                <span id="userEmail" class="user-email"></span>
                <button class="btn-secondary" onclick="logout()">Logout</button>
            </div>

            <div class="app-body">
                <!-- Documents Sidebar -->
                <div class="sidebar" id="sidebar">
                    <div class="sidebar-header">
                        <span>📂 My Documents</span>
                        <button class="btn-icon" onclick="loadDocuments()" title="Refresh">🔄</button>
                    </div>
                    <div id="documentsList" class="documents-list"></div>
                    <button class="btn-upload-new" onclick="showUploadPanel()">+ Upload New PDF</button>
                </div>

        <div class="main-panel">
        <div class="main-content-inner">
        <div class="upload-section" id="uploadSection">
                <div class="upload-card">
                    <div class="upload-icon">📤</div>
                    <h2>Upload Your PDF</h2>
                    <p>Start by uploading a PDF document to analyze</p>
                    <input type="file" id="fileInput" accept=".pdf" hidden>
                    <button class="btn-primary" onclick="document.getElementById('fileInput').click()">
                        Choose PDF File
                    </button>
                    <div id="fileName" class="file-name"></div>
                    <div id="uploadProgress" class="progress-bar" style="display: none;">
                        <div class="progress-fill"></div>
                    </div>
                    <div id="uploadStatus" class="status-message"></div>
                </div>
            </div>

            <div class="chat-section" id="chatSection" style="display: none;">
                <div class="chat-container">
                    <div class="chat-header">
                        <div class="doc-info">
                            <span class="doc-icon">📄</span>
                            <span id="docName">Document loaded</span>
                            <span class="chunk-count" id="chunkCount"></span>
                        </div>
                        <button class="btn-secondary" onclick="resetApp()">Upload New PDF</button>
                    </div>

                    <div class="messages" id="messages">
                        <div class="welcome-message">
                            <h3>👋 Ready to answer your questions!</h3>
                            <p>Ask anything about the uploaded document</p>
                        </div>
                    </div>

                    <div class="input-container">
                        <textarea 
                            id="questionInput" 
                            placeholder="Ask a question about your document..."
                            rows="1"
                        ></textarea>
                        <button id="sendBtn" class="btn-send" onclick="sendQuestion()">
                            <span class="send-icon">➤</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        </div> <!-- main-panel -->
        </div> <!-- app-body -->
        </div> <!-- appSection -->
    </div>

    <script src="script.js"></script>
</body>
</html>
